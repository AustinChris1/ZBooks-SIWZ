<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ZBooks cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f4b728" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#f4b728" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f4b728" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4b728"/>
      <stop offset="100%" stop-color="#c77f0e"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g transform="translate(0,0)" opacity="0.45">
    <circle cx="1620" cy="180" r="160" fill="#f4b728" filter="url(#soft)" opacity="0.18"/>
    <circle cx="1700" cy="900" r="220" fill="#c77f0e" filter="url(#soft)" opacity="0.10"/>
  </g>

  <g transform="translate(150,210)">
    <rect x="9" y="46" width="184" height="176" rx="44" fill="#c77f0e"/>
    <rect x="9" y="22" width="184" height="176" rx="44" fill="#f4b728"/>
    <path d="M55 70H157L55 150H157" stroke="#1a1a1a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g transform="translate(420,220)">
    <text x="0" y="0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="208" font-weight="900" fill="#ffffff" letter-spacing="-6">ZBooks</text>
    <rect x="6" y="40" width="160" height="10" rx="5" fill="url(#accent)"/>
  </g>

  <g transform="translate(420,360)">
    <text x="0" y="0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="500" fill="#e6e1d7" letter-spacing="-0.5">Non-custodial accounting and structured payouts</text>
    <text x="0" y="62" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="500" fill="#e6e1d7" letter-spacing="-0.5">for Zcash teams. Live on mainnet.</text>
  </g>

  <g transform="translate(420,500)" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="300" height="76" rx="38" fill="#f4b728" fill-opacity="0.10" stroke="#f4b728" stroke-opacity="0.85" stroke-width="2"/>
      <text x="150" y="50" text-anchor="middle" fill="#f4b728" letter-spacing="-0.2">M-of-N approvals</text>
    </g>
    <g transform="translate(324,0)">
      <rect x="0" y="0" width="290" height="76" rx="38" fill="#f4b728" fill-opacity="0.10" stroke="#f4b728" stroke-opacity="0.85" stroke-width="2"/>
      <text x="145" y="50" text-anchor="middle" fill="#f4b728" letter-spacing="-0.2">UFVK accounting</text>
    </g>
    <g transform="translate(638,0)">
      <rect x="0" y="0" width="400" height="76" rx="38" fill="#f4b728" fill-opacity="0.10" stroke="#f4b728" stroke-opacity="0.85" stroke-width="2"/>
      <text x="200" y="50" text-anchor="middle" fill="#f4b728" letter-spacing="-0.2">Multi-recipient ZIP 321</text>
    </g>
    <g transform="translate(1062,0)">
      <rect x="0" y="0" width="270" height="76" rx="38" fill="#f4b728" fill-opacity="0.10" stroke="#f4b728" stroke-opacity="0.85" stroke-width="2"/>
      <text x="135" y="50" text-anchor="middle" fill="#f4b728" letter-spacing="-0.2">Auto-reconcile</text>
    </g>
  </g>

  <g transform="translate(1340,640)" opacity="0.96">
    <rect x="0" y="0" width="430" height="220" rx="22" fill="#1f2a1c" stroke="#3fa455" stroke-width="2"/>
    <circle cx="42" cy="56" r="22" fill="#3fa455"/>
    <path d="M30 56 L40 66 L56 48" stroke="#0d1f0e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="82" y="48" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#e3f4d8">Approvals</text>
    <text x="82" y="78" font-family="ui-monospace, monospace" font-size="20" fill="#aac49b">2 of 2 . cleared</text>
    <rect x="42" y="110" width="346" height="10" rx="5" fill="#152115"/>
    <rect x="42" y="110" width="346" height="10" rx="5" fill="#3fa455"/>
    <text x="42" y="160" font-family="ui-monospace, monospace" font-size="18" fill="#9fbf90">[checkmark] alice    HMAC verified</text>
    <text x="42" y="190" font-family="ui-monospace, monospace" font-size="18" fill="#9fbf90">[checkmark] bob      HMAC verified</text>
  </g>

  <g transform="translate(150,920)">
    <text x="0" y="0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Built on SIWZ <tspan fill="#7a7a7a">.</tspan> ZecHub Hackathon 2026 <tspan fill="#7a7a7a">.</tspan> Track: Accounting <tspan fill="#7a7a7a">.</tspan> MIT</text>
    <text x="0" y="44" font-family="ui-monospace, monospace" font-size="22" fill="#9c9489">zecbooks.vercel.app</text>
  </g>

  <g transform="translate(0,1066)">
    <rect x="0" y="0" width="1920" height="14" fill="url(#accent)"/>
  </g>
</svg>
